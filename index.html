<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #1a1a1a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1rem;
        color: #ffffff;
      }

      .weather-card {
        background: #2d2d2d;
        border-radius: 24px;
        padding: 2rem;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      .search-wrapper {
        position: relative;
        margin-bottom: 1.5rem;
      }

      #search-form {
        display: flex;
        align-items: center;
        background: #3d3d3d;
        border-radius: 16px;
        padding: 0.75rem 1rem;
        gap: 0.5rem;
      }

      #search-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #ffffff;
        font-size: 1rem;
        font-family: inherit;
      }

      #search-input::placeholder {
        color: #888888;
      }

      .search-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .search-btn img {
        width: 20px;
        height: 20px;
        opacity: 0.7;
      }

      .location-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .location {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .location img {
        width: 18px;
        height: 18px;
        opacity: 0.8;
      }

      .date {
        color: #b0b0b0;
        font-size: 0.95rem;
      }

      .current-weather {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }

      .weather-icon-big {
        width: 120px;
        height: 120px;
        object-fit: contain;
      }

      .temp-info {
        text-align: right;
      }

      .temp-value {
        font-size: 4rem;
        font-weight: 300;
        line-height: 1;
        margin-bottom: 0.25rem;
      }

      .temp-condition {
        font-size: 1.1rem;
        color: #b0b0b0;
      }

      .forecast-title {
        font-size: 1rem;
        font-weight: 500;
        margin-bottom: 1rem;
        color: #e0e0e0;
      }

      .forecast-row {
        display: flex;
        gap: 0.75rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
      }

      .forecast-row::-webkit-scrollbar {
        display: none;
      }

      .forecast-card {
        background: #3a3a3a;
        border-radius: 16px;
        padding: 1rem 0.75rem;
        min-width: 72px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
      }

      .forecast-day {
        font-size: 0.85rem;
        color: #cccccc;
        font-weight: 500;
      }

      .forecast-icon {
        width: 40px;
        height: 40px;
        object-fit: contain;
      }

      .forecast-temp {
        font-size: 0.95rem;
        font-weight: 600;
      }
      .error {
        color: #ff6b6b;
        text-align: center;
        margin-top: 0.5rem;
        font-size: 0.9rem;
        min-height: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="weather-card">
      <div class="search-wrapper">
        <form id="search-form">
          <input
            type="text"
            id="search-input"
            placeholder="Search city..."
            autocomplete="off"
          />
          <button type="submit" class="search-btn">
            <img src="img/search.png" alt="search" />
          </button>
        </form>
        <p class="error" id="error"></p>
      </div>

      <div id="current">
        <div class="location-row">
          <div class="location">
            <img src="img/location.png" alt="location" />
            <span>Search for a city</span>
          </div>
          <div class="date" id="current-date">--</div>
        </div>
      </div>
      <div id="forecast"></div>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
